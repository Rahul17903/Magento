<tr class="totals shipping excl">

        colspan="1"
        scope="row"
        data-bind="text: title + ' : ' + getShippingMethodTitle().replace(/[()]/g, '').replace(/^.* - /, '')">
    </th>

    <td class="amount">
        <span class="price" data-bind="text: getValue()"></span>
    </td>
</tr>
